{% extends 'base.html' %}
{% block title %}{{ product.name }} | Luxemart{% endblock %}
{% block content %}
<div class="card luxe-card">
  <div class="card-body">
    <h1 class="h3">{{ product.name }}</h1>
    <p class="text-muted mb-2">{{ product.category.name }}</p>
    <p>{{ product.description }}</p>
    <p class="fw-semibold">Price: {{ product.price }}</p>
    <p>Stock: {{ product.stock_quantity }}</p>
  </div>
</div>
{% endblock %}
