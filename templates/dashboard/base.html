{% extends 'base.html' %}

{% block content %}
<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="admin-sidebar__brand">
      <span class="admin-kicker">Luxemart</span>
      <strong>Control Center</strong>
    </div>
    <nav class="admin-menu" aria-label="Admin menu">
      {% for item in admin_nav %}
        <a class="admin-menu__item {% if item.key == active_admin_section %}is-active{% endif %}" href="{% url item.url_name %}">
          <span>{{ item.label }}</span>
        </a>
      {% endfor %}
    </nav>
  </aside>

  <section class="admin-main">
    {% if messages %}
      <div class="admin-messages">
        {% for message in messages %}
          <div class="alert alert-{{ message.tags|default:'info' }} mb-2">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
    {% block admin_content %}{% endblock %}
  </section>
</div>
{% endblock %}
