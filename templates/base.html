{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Luxemart{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    {% block extra_css %}{% endblock %}
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark luxe-nav px-4">
      <a class="navbar-brand fw-semibold" href="/">Luxemart</a>
      <div class="ms-auto d-flex gap-3">
        <a class="nav-link text-white" href="/cart/">Cart</a>
        <a class="nav-link text-white" href="/orders/">Orders</a>
        <a class="nav-link text-white" href="/dashboard/">Dashboard</a>
      </div>
    </nav>
    <main class="container py-5">
      {% block content %}{% endblock %}
    </main>
    <script src="{% static 'js/app.js' %}"></script>
    {% block extra_js %}{% endblock %}
  </body>
</html>
