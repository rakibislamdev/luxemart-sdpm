{% extends 'base.html' %}
{% block title %}Sign In | Luxemart{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="luxe-card p-4">
      <h1 class="h3 mb-4 text-center">Sign In</h1>
      <form method="post" class="admin-form">
        {% csrf_token %}
        {{ form.non_field_errors }}
        <div class="mb-3">
          <label for="{{ form.username.id_for_label }}" class="form-label">Username or Email</label>
          {{ form.username }}
          {{ form.username.errors }}
        </div>
        <div class="mb-4">
          <label for="{{ form.password.id_for_label }}" class="form-label">Password</label>
          {{ form.password }}
          {{ form.password.errors }}
        </div>
        <button type="submit" class="btn btn-primary w-100 btn-lg">Sign In</button>
      </form>
      <div class="mt-4 text-center">
        <p class="mb-0">Don't have an account? <a href="{% url 'accounts:register' %}" class="text-primary fw-bold">Sign Up</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
